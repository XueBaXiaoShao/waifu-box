[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-waifu-box"
version = "0.1.0"
description = "每日老婆独立插件：VNDB 角色抽卡（waifu/yuzuwaifu）、LRU 轮换、本地缓存与定时刷新"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "eval_type_backport>=0.2.0; python_version < '3.10'",
]

[tool.setuptools]
packages = ["waifu_box"]
